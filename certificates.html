<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificates | Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; font-family: Arial, Helvetica, sans-serif; color: #172033; background: #f6f8fb; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 3rem); }
    .intro { margin: 0 0 28px; color: #596579; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .card { display: flex; flex-direction: column; gap: 16px; padding: 22px; background: #fff; border: 1px solid #e5eaf1; border-radius: 16px; box-shadow: 0 8px 24px rgba(20,35,60,.05); }
    .logo-wrap { height: 100px; display: flex; align-items: center; justify-content: center; }
    .logo { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    .logo.unodc { width: 100%; }
    .logo.unitar { max-width: 100px; }
    h2 { margin: 0 0 7px; font-size: 1.1rem; }
    p { margin: 0; color: #596579; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Certificates</h1>
    <p class="intro">Selected training and professional development.</p>
    <section class="grid" aria-label="Certificates">
      <article class="card">
        <div class="logo-wrap"><img class="logo unodc" src="assets/logos/unodc.png" alt="UNODC logo"></div>
        <div><h2>UNODC — Anti-Corruption</h2><p>Certificate in anti-corruption training.</p></div>
      </article>
      <article class="card">
        <div class="logo-wrap"><img class="logo unitar" src="assets/logos/unitar.png" alt="UNITAR logo"></div>
        <div><h2>UNITAR — Arms Trade Treaty</h2><p>Training on annual reporting under the Arms Trade Treaty.</p></div>
      </article>
    </section>
  </main>
</body>
</html>
